<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="金句抽卡">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>金句抽卡</title>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <span class="header-icon">&#128218;</span>
      <span class="title">金句抽卡</span>
    </div>
    <div class="subtitle">剩余 <span id="remaining">54</span> 张 / 共 54 张</div>
  </div>

  <div class="page-container">
    <div class="page active" id="pageDraw">
      <div class="draw-content">
        <div class="deck-visual" id="deckVisual">
          <div class="deck-stack" id="deckStack">
            <div class="deck-base"></div>
            <div class="deck-base"></div>
            <div class="deck-base">
              <span class="deck-icon">&#128218;</span>
              <span class="deck-label">金句牌组</span>
            </div>
          </div>
          <span class="deck-hint">点击下方按钮抽取智慧</span>
        </div>

        <div class="card-area" id="cardArea" style="display:none;"></div>

        <div class="empty-text" id="emptyState" style="display:none;">
          全部抽完啦<br><span style="font-size:12px;color:rgba(0,0,0,0.25);">点击重新洗牌开始新一轮</span>
        </div>
      </div>

      <div class="actions" id="actionsArea">
        <div class="btn-row">
          <button class="btn btn-primary" onclick="drawCard(1)">抽一张</button>
          <button class="btn btn-secondary" onclick="drawCard(3)">抽三张</button>
          <button class="btn btn-outline" onclick="drawCard(5)">抽五张</button>
        </div>
        <button class="btn-reset" onclick="resetDeck()">&#8635; 重新洗牌</button>
      </div>
    </div>

    <div class="page" id="pageHistory">
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">还没有抽过卡<br><span style="font-size:12px;">去抽几张吧 &#10024;</span></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" id="navDraw" onclick="switchPage('draw')">
      <span class="nav-icon">&#127183;</span>
      <span class="nav-label">抽卡</span>
    </button>
    <button class="nav-item" id="navHistory" onclick="switchPage('history')">
      <span class="nav-icon">&#128211;</span>
      <span class="nav-label">记录</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
