<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="金句抽卡">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>金句抽卡</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: radial-gradient(ellipse at 30% 20%, #1e1e3a 0%, #1a1a2e 40%, #13132b 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 20px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Header ===== */
    .header { text-align:center; margin-bottom: 28px; }
    .title {
      display:block; font-size:28px; font-weight:800;
      background: linear-gradient(135deg, #e8d5b7 20%, #f0e6c8 50%, #d4a24e 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 5px;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 8px rgba(201,169,110,0.35));
    }
    .subtitle { font-size:12px; color:rgba(255,255,255,0.32); }

    /* ===== Deck Visual ===== */
    .deck-visual {
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .deck-stack { position:relative; width:180px; height:240px; margin-bottom:14px; }

    /* 牌堆底部底座 */
    .deck-base {
      position:absolute; width:160px; height:224px;
      border-radius:14px;
      background: linear-gradient(160deg, #2a1f5c, #1b1545);
      border: 1.5px solid rgba(201,169,110,0.18);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .deck-base:nth-child(1) { top:0; left:10px; z-index:1; }
    .deck-base:nth-child(2) { top:2px; left:10px; z-index:2; }
    .deck-base:nth-child(3) {
      top:4px; left:10px; z-index:3;
      background: linear-gradient(160deg, #3d2b7a, #24185a);
      border-color: rgba(201,169,110,0.35);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:6px;
    }
    .deck-icon { font-size:32px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
    .deck-label { font-size:10px; color:rgba(232,213,183,0.6); letter-spacing:3px; }
    .deck-hint {
      font-size:11px; color:rgba(255,255,255,0.25);
      margin-top:2px;
    }

    /* ===== Shuffle animation ===== */
    @keyframes shuffleDeck {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(-6deg) translateX(-4px); }
      40%  { transform: rotate(5deg) translateX(4px); }
      60%  { transform: rotate(-4deg) translateX(-3px); }
      80%  { transform: rotate(3deg) translateX(2px); }
      100% { transform: rotate(0deg); }
    }
    .deck-stack.shuffling .deck-base:nth-child(3) {
      animation: shuffleDeck 0.5s ease-in-out;
    }

    /* ===== Card Area ===== */
    .card-area {
      width:100%; display:flex; flex-direction:column;
      align-items:center; margin-bottom:28px;
    }

    /* ===== Single Card 3D Flip ===== */
    .card-wrapper {
      width:100%;
      perspective: 1200px;
      margin-bottom:16px;
    }
    .card-inner {
      width:100%;
      position:relative;
      transform-style:preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      cursor:default;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    /* Card face - shared */
    .card-face {
      width:100%;
      border-radius:18px;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      position:absolute;
      top:0; left:0;
      overflow:hidden;
    }

    /* CARD BACK (金句牌背) */
    .card-back-face {
      position:relative;
      width:100%;
      background:
        linear-gradient(135deg, #2a1f5c 0%, #1b1545 50%, #130e2a 100%);
      border: 1.5px solid rgba(201,169,110,0.3);
      box-shadow:
        0 14px 52px rgba(0,0,0,0.55),
        0 0 0 1px rgba(201,169,110,0.1),
        inset 0 1px 0 rgba(255,255,255,0.06);
      aspect-ratio: 5/7;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }

    /* 牌背装饰花纹 */
    .card-back-face::before {
      content:'';
      position:absolute; inset:8px;
      border: 1px solid rgba(201,169,110,0.15);
      border-radius:13px;
      pointer-events:none;
    }
    .card-back-face::after {
      content:'';
      position:absolute; inset:14px;
      border: 0.5px solid rgba(201,169,110,0.08);
      border-radius:11px;
      pointer-events:none;
    }
    .back-content {
      display:flex; flex-direction:column; align-items:center; gap:10px;
      z-index:1;
    }
    .back-icon { font-size:38px; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
    .back-title {
      font-size:14px;
      background: linear-gradient(135deg, #e8d5b7, #d4a24e);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      letter-spacing:4px; font-weight:700;
    }
    .back-sub {
      font-size:9px; color:rgba(232,213,183,0.35);
      letter-spacing:2px; margin-top:2px;
    }

    /* CARD FRONT (金句正面) */
    .card-front-face {
      transform: rotateY(180deg);
      position:relative;
      width:100%;
      background:
        linear-gradient(170deg, #fffef7 0%, #f5f0e0 40%, #ede6d3 100%);
      border: 1.5px solid rgba(201,169,110,0.5);
      box-shadow:
        0 14px 52px rgba(0,0,0,0.55),
        0 0 0 1px rgba(201,169,110,0.15),
        inset 0 1px 0 rgba(255,255,255,0.8);
      aspect-ratio: 5/7;
      padding: 22px 18px 18px;
      display:flex; flex-direction:column;
      overflow:hidden;
    }

    /* 纸纹效果 */
    .card-front-face::before {
      content:'';
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(201,169,110,0.03) 2px,
          rgba(201,169,110,0.03) 4px
        );
      border-radius:18px;
      pointer-events:none;
    }

    /* 牌面边框装饰 */
    .card-front-face::after {
      content:'';
      position:absolute; inset:6px;
      border: 0.5px solid rgba(201,169,110,0.2);
      border-radius:14px;
      pointer-events:none;
    }

    .card-front-inner {
      position:relative; z-index:1;
      display:flex; flex-direction:column;
      height:100%;
    }

    /* 顶部：分类标签 */
    .card-category {
      display:inline-flex; align-items:center; gap:4px;
      padding: 3px 10px;
      border-radius:20px;
      font-size:10px;
      font-weight:600;
      letter-spacing:1.5px;
      align-self:flex-start;
      margin-bottom:14px;
    }
    .cat-战略 { background:rgba(231,76,60,0.12); color:#c0392b; }
    .cat-工作 { background:rgba(41,128,185,0.12); color:#1a6fa0; }
    .cat-哲学 { background:rgba(39,174,96,0.12); color:#1e8449; }
    .cat-精神 { background:rgba(142,68,173,0.12); color:#7d3c98; }

    /* 金句正文 */
    .card-quote {
      font-size:17px;
      font-weight:700;
      color:#1a1a2e;
      line-height:1.65;
      margin-bottom:16px;
      padding-left:12px;
      border-left: 3px solid;
      border-image: linear-gradient(to bottom, #c9a96e, #e8d5b7) 1;
      flex:1;
    }
    .cat-战略 .card-quote { border-image: linear-gradient(to bottom, #e74c3c, #f1948a) 1; }
    .cat-工作 .card-quote { border-image: linear-gradient(to bottom, #2980b9, #85c1e9) 1; }
    .cat-哲学 .card-quote { border-image: linear-gradient(to bottom, #27ae60, #82e0aa) 1; }

    /* 分割线 */
    .card-divider {
      height:1px;
      background: linear-gradient(90deg, rgba(201,169,110,0.3), rgba(201,169,110,0.08));
      margin-bottom:14px;
    }

    /* 解读 */
    .card-interpretation {
      font-size:12.5px;
      color:#555;
      line-height:1.75;
      position:relative;
      padding-left:10px;
    }
    .card-interpretation::before {
      content:'💡';
      position:absolute; left:-2px; top:-1px;
      font-size:10px;
    }

    /* 编号 */
    .card-number {
      align-self:flex-end;
      font-size:10px;
      color:rgba(26,26,46,0.18);
      font-weight:700;
      letter-spacing:1px;
      margin-top:8px;
    }

    /* ===== Draw animation ===== */
    @keyframes drawCard {
      0%   { opacity:0; transform:translateY(60px) rotate(-3deg) scale(0.85); }
      60%  { opacity:1; transform:translateY(-8px) rotate(0.5deg) scale(1.02); }
      100% { transform:translateY(0) rotate(0) scale(1); }
    }
    .card-wrapper.drawing { animation: drawCard 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }

    /* ===== Multi Cards ===== */
    .multi-cards {
      display:flex; gap:10px; flex-wrap:nowrap;
      overflow-x:auto; width:100%;
      padding:4px 0 16px;
      -webkit-overflow-scrolling:touch;
    }
    .multi-cards::-webkit-scrollbar { display:none; }
    .mini-card {
      flex:0 0 auto; width:140px;
      background: linear-gradient(170deg, #fffef7, #f5f0e0);
      border-radius:12px; padding:14px 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(201,169,110,0.3);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      position:relative;
      overflow:hidden;
    }
    .mini-card::before {
      content:'';
      position:absolute; inset:4px;
      border:0.5px solid rgba(201,169,110,0.15);
      border-radius:9px; pointer-events:none;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(0.5) translateY(24px); }
      to   { opacity:1; transform:none; }
    }
    .mini-cat { font-size:9px; color:#999; margin-bottom:6px; display:block; letter-spacing:1px; }
    .mini-quote { font-size:12px; font-weight:700; color:#1a1a2e; line-height:1.5; }
    .mini-num { font-size:9px; color:rgba(26,26,46,0.2); margin-top:8px; display:block; }

    /* ===== Close btn ===== */
    .close-btn {
      padding:10px 36px;
      background:rgba(255,255,255,0.07);
      border-radius:24px;
      color:rgba(255,255,255,0.4);
      font-size:13px;
      cursor:pointer;
      border:none;
      transition: background 0.15s;
      margin-top:8px;
    }
    .close-btn:active { background:rgba(255,255,255,0.14); }

    /* ===== Empty ===== */
    .empty-text {
      font-size:18px; color:rgba(255,255,255,0.28);
      margin-bottom:28px; text-align:center;
      line-height:1.8;
    }

    /* ===== Buttons ===== */
    .actions { width:100%; margin-bottom:28px; }
    .btn-row { display:flex; gap:9px; margin-bottom:10px; }
    .btn {
      flex:1; height:50px; display:flex; align-items:center; justify-content:center;
      border-radius:14px; font-size:15.5px; font-weight:700;
      letter-spacing:1.5px;
      cursor:pointer; border:none;
      transition: transform 0.1s, box-shadow 0.15s;
      user-select:none;
    }
    .btn:active { transform:scale(0.95); }
    .btn-primary {
      background: linear-gradient(135deg, #e8d5b7, #c9a96e);
      color:#1a1a2e;
      box-shadow: 0 4px 18px rgba(201,169,110,0.4);
    }
    .btn-primary:active { box-shadow: 0 2px 8px rgba(201,169,110,0.5); }
    .btn-secondary {
      background:rgba(232,213,183,0.1);
      color:#e8d5b7;
      border: 1.5px solid rgba(232,213,183,0.22);
    }
    .btn-outline {
      background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.5);
      border:1.5px solid rgba(255,255,255,0.1);
    }
    .btn-reset {
      width:100%; height:42px; display:flex; align-items:center; justify-content:center;
      border-radius:14px; font-size:12.5px;
      color:rgba(255,255,255,0.28);
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      cursor:pointer; letter-spacing:1px;
      transition: background 0.15s;
    }
    .btn-reset:active { background:rgba(255,255,255,0.07); }

    /* ===== History ===== */
    .history-section {
      width:100%;
      background:rgba(255,255,255,0.025);
      border-radius:16px;
      padding:14px 14px;
      border:1px solid rgba(255,255,255,0.05);
    }
    .history-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:10px;
    }
    .history-title {
      font-size:11px; color:rgba(255,255,255,0.35);
      font-weight:600; letter-spacing:1px;
    }
    .history-list { max-height:200px; overflow-y:auto; }
    .history-list::-webkit-scrollbar { width:2px; }
    .history-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
    .history-item {
      display:flex; align-items:flex-start;
      padding:9px 6px;
      border-bottom:1px solid rgba(255,255,255,0.04);
      gap:10px;
    }
    .history-item:last-child { border-bottom:none; }
    .history-num {
      font-size:10px; color:rgba(255,255,255,0.18);
      width:20px; flex-shrink:0; padding-top:1px;
      font-weight:600;
    }
    .history-info { flex:1; min-width:0; }
    .history-cat { font-size:9px; color:rgba(255,255,255,0.25); margin-bottom:2px; }
    .history-quote {
      font-size:12.5px; color:rgba(255,255,255,0.65);
      font-weight:500; line-height:1.45;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <span class="title">金句抽卡</span>
    <span class="subtitle">剩余 <span id="remaining">54</span> 张 / 共 54 张</span>
  </div>

  <!-- Deck visual -->
  <div class="deck-visual" id="deckVisual">
    <div class="deck-stack" id="deckStack">
      <div class="deck-base"></div>
      <div class="deck-base"></div>
      <div class="deck-base">
        <span class="deck-icon">📖</span>
        <span class="deck-label">金句牌组</span>
      </div>
    </div>
    <span class="deck-hint">点击下方按钮抽取智慧 ✨</span>
  </div>

  <!-- Card result area -->
  <div class="card-area" id="cardArea" style="display:none;"></div>

  <!-- Empty state -->
  <div class="empty-text" id="emptyState" style="display:none;">
    全部抽完啦 🎉<br><span style="font-size:13px;color:rgba(255,255,255,0.22);">点击重新洗牌开始新一轮</span>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="drawCard(1)">抽一张</button>
      <button class="btn btn-secondary" onclick="drawCard(3)">抽三张</button>
      <button class="btn btn-outline" onclick="drawCard(5)">抽五张</button>
    </div>
    <button class="btn-reset" onclick="resetDeck()">↻ 重新洗牌</button>
  </div>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none;">
    <div class="history-header">
      <span class="history-title">已抽记录 <span id="historyCount">0</span> / 54</span>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
// ==================== 卡牌数据 ====================
const CARDS = [
  { id:1,  cat:'战略与斗争', quote:'枪杆子里面出政权', interpretation:'在职场中，核心业务能力和不可替代的硬技能，就是你的"枪杆子"。' },
  { id:2,  cat:'战略与斗争', quote:'一切反动派都是纸老虎', interpretation:'面对看似强大的竞争对手或巨大的困难，要在心理上藐視它，不要被它的气势吓倒。' },

  { id:19, cat:'工作与领导', quote:'从群众中来，到群众中去', interpretation:'好的方案不是闭门造车出来的，而是收集一线反馈，优化后再推广回去。' },

function catClass(cat) {
  if (cat.startsWith('战略')) return 'cat-战略';
  if (cat.startsWith('工作')) return 'cat-工作';
  if (cat.startsWith('哲学')) return 'cat-哲学';
  return 'cat-精神';
}

// ==================== 洗牌 ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== 状态 ====================
let deck = shuffle([...CARDS]);
let history = [];
let animating = false;

// ==================== DOM ====================
const $remaining     = document.getElementById('remaining');
const $deckVisual   = document.getElementById('deckVisual');
const $deckStack    = document.getElementById('deckStack');
const $cardArea     = document.getElementById('cardArea');
const $emptyState   = document.getElementById('emptyState');
const $historySection = document.getElementById('historySection');
const $historyCount = document.getElementById('historyCount');
const $historyList  = document.getElementById('historyList');

function updateUI() {
  $remaining.textContent = deck.length;
  const idle = $cardArea.style.display === 'none';
  $deckVisual.style.display = (deck.length > 0 && idle) ? '' : 'none';
  $emptyState.style.display  = (deck.length === 0 && idle) ? '' : 'none';
}

// ==================== 抽牌 ====================
function drawCard(count) {
  if (animating) return;
  if (deck.length < count) {
    showToast(deck.length === 0 ? '已抽完，请重新洗牌' : `剩余${deck.length}张，不够${count}张`);
    return;
  }
  animating = true;
  const drawn = deck.splice(deck.length - count, count).reverse();
  history = [...drawn, ...history];

  $deckVisual.style.display = 'none';
  $emptyState.style.display = 'none';
  $cardArea.style.display  = '';

  if (count === 1) {
    renderSingle(drawn[0]);
  } else {
    renderMulti(drawn);
  }
  updateHistory();
  updateUI();
  setTimeout(() => { animating = false; }, count === 1 ? 1100 : 600);
}

// 单张 - 真·3D 翻牌
function renderSingle(card) {
  const cc = catClass(card.cat);
  $cardArea.innerHTML = `
    <div class="card-wrapper drawing" id="cardWrapper">
      <div class="card-inner" id="cardInner">
        <!-- 牌背 -->
        <div class="card-face card-back-face">
          <div class="back-content">
            <span class="back-icon">📖</span>
            <span class="back-title">金 句 牌</span>
            <span class="back-sub">GOLDEN QUOTES</span>
          </div>
        </div>
        <!-- 牌面 -->
        <div class="card-face card-front-face">
          <div class="card-front-inner">
            <span class="card-category ${cc}">${card.cat}</span>
            <div class="card-quote">${card.quote}</div>
            <div class="card-divider"></div>
            <div class="card-interpretation">${card.interpretation}</div>
            <span class="card-number">No.${String(card.id).padStart(2,'0')}</span>
          </div>
        </div>
      </div>
    </div>
    <button class="close-btn" onclick="closeResult()">收起</button>
  `;
  // 等抽牌动画结束后翻牌
  setTimeout(() => {
    const inner = document.getElementById('cardInner');
    if (inner) inner.classList.add('flipped');
  }, 500);
}

// 多张
function renderMulti(cards) {
  let html = '<div class="multi-cards">';
  cards.forEach((c, i) => {
    const cc = catClass(c.cat);
    html += `
      <div class="mini-card" style="animation-delay:${i*0.1}s">
        <span class="mini-cat">${c.cat}</span>
        <div class="mini-quote">${c.quote}</div>
        <span class="mini-num">No.${String(c.id).padStart(2,'0')}</span>
      </div>`;
  });
  html += '</div><button class="close-btn" onclick="closeResult()">收起</button>';
  $cardArea.innerHTML = html;
}

function closeResult() {
  $cardArea.style.display = 'none';
  $cardArea.innerHTML = '';
  updateUI();
}

function resetDeck() {
  // 洗牌抖牌动画
  $deckStack.classList.add('shuffling');
  setTimeout(() => $deckStack.classList.remove('shuffling'), 500);

  deck = shuffle([...CARDS]);
  history = [];
  $cardArea.style.display = 'none';
  $cardArea.innerHTML = '';
  updateHistory();
  updateUI();
  showToast('已重新洗牌 🎴');
}

// ==================== 历史 ====================
function updateHistory() {
  if (history.length === 0) { $historySection.style.display = 'none'; return; }
  $historySection.style.display = '';
  $historyCount.textContent = history.length;
  $historyList.innerHTML = history.map(c => `
    <div class="history-item">
      <span class="history-num">${String(c.id).padStart(2,'0')}</span>
      <div class="history-info">
        <div class="history-cat">${c.cat}</div>
        <div class="history-quote">${c.quote}</div>
      </div>
    </div>`).join('');
}

// ==================== Toast ====================
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', top:'72px', left:'50%', transform:'translateX(-50%)',
    background:'rgba(0,0,0,0.72)', color:'#fff', padding:'9px 22px',
    borderRadius:'20px', fontSize:'13px', zIndex:'9999',
    transition:'opacity 0.3s', opacity:'1', whiteSpace:'nowrap'
  });
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 300); }, 1800);
}

// ==================== Service Worker ====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
updateUI();
</script>
