<html lang="zh-CN">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="金句抽卡">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>金句抽卡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 52px 20px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Header ===== */
    .header { text-align: center; margin-bottom: 32px; }
    .title {
      display: block; font-size: 26px; font-weight: 700;
      color: #e8d5b7; letter-spacing: 4px; margin-bottom: 8px;
    }
    .subtitle { font-size: 13px; color: rgba(255,255,255,0.38); }

    /* ===== Deck Visual ===== */
    .deck-visual {
      margin-bottom: 40px; display: flex;
      flex-direction: column; align-items: center;
    }
    .deck-stack { position: relative; width: 220px; height: 140px; margin-bottom: 16px; }
    .deck-card {
      position: absolute; width: 220px; height: 132px; border-radius: 14px;
      border: 1.5px solid rgba(232,213,183,0.15);
      background: linear-gradient(135deg, #2d3561, #1e2243);
      display: flex; align-items: center; justify-content: center;
    }
    .deck-card:nth-child(1) { top: 8px; left: 0; box-shadow: 0 8px 28px rgba(0,0,0,0.5); z-index: 3; }
    .deck-card:nth-child(2) { top: 4px; left: 0; opacity: 0.7; z-index: 2; }
    .deck-card:nth-child(3) { top: 0; left: 0; opacity: 0.4; z-index: 1; }
    .deck-card-inner {
      width: 196px; height: 108px; border-radius: 8px;
      border: 1px solid rgba(232,213,183,0.12);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    }
    .deck-icon { font-size: 28px; opacity: 0.5; }
    .deck-label { font-size: 11px; color: rgba(232,213,183,0.4); letter-spacing: 2px; }
    .deck-hint { font-size: 12px; color: rgba(255,255,255,0.28); }

    /* ===== Card Result Area ===== */
    .card-area {
      width: 100%; display: flex; flex-direction: column;
      align-items: center; margin-bottom: 32px;
    }

    /* ——— Single Card ——— */
    .card-wrapper {
      width: 100%; perspective: 1000px; margin-bottom: 16px;
    }
    .card-result {
      width: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    .card-result.revealed { transform: rotateY(0deg); }

    .card-back {
      width: 100%; border-radius: 18px;
      background: linear-gradient(135deg, #2d3561, #1e2243);
      border: 1.5px solid rgba(255,255,255,0.1);
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      padding: 28px 0; backface-visibility: hidden;
      animation: pulse 1s ease-in-out infinite;
    }
    .card-back-inner {
      width: calc(100% - 32px); padding: 24px 0;
      border: 1px solid rgba(232,213,183,0.15); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .card-back-icon { font-size: 40px; opacity: 0.3; }
    .card-back-text { font-size: 12px; color: rgba(232,213,183,0.3); letter-spacing: 3px; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }

    .card-face {
      position: absolute; inset: 0; border-radius: 18px;
      background: linear-gradient(160deg, #fffef5 0%, #f5f0e1 100%);
      box-shadow: 0 12px 48px rgba(0,0,0,0.5), 0 0 0 1.5px rgba(232,213,183,0.4);
      opacity: 0; transform: scale(0.88) rotateY(8deg);
      transition: all 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
      padding: 20px 18px 18px; display: flex; flex-direction: column;
      backface-visibility: hidden;
    }
    .card-result.revealed .card-face {
      opacity: 1; transform: scale(1) rotateY(0deg);
    }
    .card-result.revealed .card-back { opacity: 0; }

    /* Card face content */
    .card-category {
      display: inline-flex; align-items: center;
      background: rgba(26,26,46,0.08); border-radius: 20px;
      padding: 3px 10px; font-size: 11px;
      color: #666; letter-spacing: 1px; margin-bottom: 12px;
      align-self: flex-start;
    }
    .card-quote {
      font-size: 17px; font-weight: 700; color: #1a1a2e;
      line-height: 1.55; margin-bottom: 14px;
      border-left: 3px solid #c9a96e; padding-left: 10px;
    }
    .card-divider {
      height: 1px; background: rgba(26,26,46,0.08); margin-bottom: 12px;
    }
    .card-interpretation {
      font-size: 13px; color: #555; line-height: 1.7; flex: 1;
    }
    .card-number {
      align-self: flex-end; font-size: 11px; color: rgba(26,26,46,0.2);
      margin-top: 10px; font-weight: 600;
    }

    /* Category colors */
    .cat-战略 { background: rgba(231,76,60,0.1); color: #c0392b; }
    .cat-工作 { background: rgba(41,128,185,0.1); color: #2471a3; }
    .cat-哲学 { background: rgba(39,174,96,0.1); color: #1e8449; }
    .cat-精神 { background: rgba(142,68,173,0.1); color: #7d3c98; }

    /* ——— Multi Cards ——— */
    .multi-cards {
      display: flex; gap: 10px; flex-wrap: nowrap;
      overflow-x: auto; width: 100%; padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch;
    }
    .multi-cards::-webkit-scrollbar { display: none; }
    .mini-card {
      flex: 0 0 auto; width: 150px;
      background: linear-gradient(160deg, #fffef5, #f5f0e1);
      border-radius: 14px; padding: 14px 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes pop {
      from { opacity:0; transform: scale(0.6) translateY(16px); }
      to { opacity:1; transform: none; }
    }
    .mini-cat {
      font-size: 10px; color: #888; margin-bottom: 6px;
      display: block; letter-spacing: 1px;
    }
    .mini-quote {
      font-size: 12px; font-weight: 700; color: #1a1a2e;
      line-height: 1.5; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .mini-num { font-size: 10px; color: rgba(26,26,46,0.2); }

    /* Close btn */
    .close-btn {
      padding: 9px 36px; background: rgba(255,255,255,0.08);
      border-radius: 24px; color: rgba(255,255,255,0.4); font-size: 13px;
      cursor: pointer; border: none; transition: background 0.15s;
    }
    .close-btn:active { background: rgba(255,255,255,0.15); }

    /* Empty */
    .empty-text { font-size: 20px; color: rgba(255,255,255,0.32); margin-bottom: 32px; }

    /* ===== Buttons ===== */
    .actions { width: 100%; margin-bottom: 32px; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn {
      flex: 1; height: 50px; display: flex; align-items: center; justify-content: center;
      border-radius: 14px; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      cursor: pointer; border: none; transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: linear-gradient(135deg, #e8d5b7, #c9a96e); color: #1a1a2e;
      box-shadow: 0 4px 18px rgba(201,169,110,0.35);
    }
    .btn-secondary {
      background: rgba(232,213,183,0.1); color: #e8d5b7;
      border: 1.5px solid rgba(232,213,183,0.22);
    }
    .btn-outline {
      background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5);
      border: 1.5px solid rgba(255,255,255,0.1);
    }
    .btn-reset {
      width: 100%; height: 42px; display: flex; align-items: center; justify-content: center;
      border-radius: 14px; font-size: 13px; color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer; letter-spacing: 1px;
    }
    .btn-reset:active { background: rgba(255,255,255,0.07); }

    /* ===== History ===== */
    .history-section {
      width: 100%; background: rgba(255,255,255,0.03);
      border-radius: 16px; padding: 16px 14px;
    }
    .history-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .history-title { font-size: 12px; color: rgba(255,255,255,0.38); font-weight: 600; letter-spacing: 1px; }
    .history-list { max-height: 220px; overflow-y: auto; }
    .history-list::-webkit-scrollbar { width: 2px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .history-item {
      display: flex; align-items: flex-start; padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-num { font-size: 11px; color: rgba(255,255,255,0.22); width: 22px; flex-shrink: 0; padding-top: 1px; }
    .history-info { flex: 1; min-width: 0; }
    .history-cat { font-size: 10px; color: rgba(255,255,255,0.3); margin-bottom: 2px; }
    .history-quote { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; line-height: 1.4; }

    /* Install hint */
    .install-hint {
      margin-top: 18px; padding: 13px 16px;
      background: rgba(232,213,183,0.07); border-radius: 12px;
      border: 1px solid rgba(232,213,183,0.13); text-align: center; max-width: 340px;
    }
    .install-hint p { font-size: 11px; color: rgba(255,255,255,0.42); line-height: 1.7; }
    .install-hint strong { color: #e8d5b7; }
  </style>
</head>

<div class="container">
  <!-- Header -->
  <div class="header">
    <span class="title">☆ 金句抽卡</span>

      <div class="deck-card"></div>
    </div>
    <span class="deck-hint">点击下方按钮抽取智慧</span>

  <!-- Card result area -->
  <div class="card-area" id="cardArea" style="display:none;"></div>

  <!-- Empty state -->
  <div class="empty-text" id="emptyState" style="display:none;">全部抽完啦 🎉</div>

  <!-- Buttons -->
  <div class="actions">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="drawCard(1)">抽一张</button>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none;">
    <div class="history-header">
      <span class="history-title">已抽记录 <span id="historyCount">0</span> / 54</span>

    <div class="history-list" id="historyList"></div>

  <!-- Install hint -->

    <p><strong>📱 添加到主屏幕</strong><br>Safari 打开 → 分享按钮 → 添加到主屏幕</p>

</div>

// 分类简写 → CSS 类名
function catClass(cat) {
  if (cat.startsWith('战略')) return 'cat-战略';
  if (cat.startsWith('工作')) return 'cat-工作';
  if (cat.startsWith('哲学')) return 'cat-哲学';
  return 'cat-精神';
}

// ==================== 洗牌 ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== 状态 ====================
let deck = shuffle([...CARDS]);
let history = [];
let animating = false;

// ==================== DOM ====================
const $remaining    = document.getElementById('remaining');
const $deckVisual   = document.getElementById('deckVisual');
const $cardArea     = document.getElementById('cardArea');
const $emptyState   = document.getElementById('emptyState');
const $historySection = document.getElementById('historySection');
const $historyCount = document.getElementById('historyCount');
const $historyList  = document.getElementById('historyList');

function updateUI() {
  $remaining.textContent = deck.length;
  const idle = $cardArea.style.display === 'none';
  $deckVisual.style.display = (deck.length > 0 && idle) ? '' : 'none';
  $emptyState.style.display = (deck.length === 0 && idle) ? '' : 'none';
}

// ==================== 抽牌 ====================
function drawCard(count) {
  if (animating) return;
  if (deck.length < count) {
    showToast(deck.length === 0 ? '已抽完，请重新洗牌' : `剩余${deck.length}张，不够${count}张`);
    return;
  }
  animating = true;
  const drawn = deck.splice(deck.length - count, count).reverse();
  history = [...drawn, ...history];

  $deckVisual.style.display = 'none';
  $emptyState.style.display = 'none';
  $cardArea.style.display = '';

  if (count === 1) {
    renderSingle(drawn[0]);
  } else {
    renderMulti(drawn);
  }
  updateHistory();
  updateUI();
  setTimeout(() => { animating = false; }, count === 1 ? 1000 : 600);
}

// 单张 - 翻牌效果
function renderSingle(card) {
  const cc = catClass(card.cat);
  $cardArea.innerHTML = `
    <div class="card-wrapper">
      <div class="card-result" id="cardResult">
        <div class="card-back">
          <div class="card-back-inner">
            <span class="card-back-icon">📖</span>
            <span class="card-back-text">金 句 牌</span>
          </div>
        </div>
        <div class="card-face">
          <span class="card-category ${cc}">${card.cat}</span>
          <div class="card-quote">${card.quote}</div>
          <div class="card-divider"></div>
          <div class="card-interpretation">${card.interpretation}</div>
          <span class="card-number">No.${String(card.id).padStart(2,'0')}</span>
        </div>
      </div>
    </div>
    <button class="close-btn" onclick="closeResult()">收起</button>
  `;
  requestAnimationFrame(() => {
    setTimeout(() => {
      const el = document.getElementById('cardResult');
      if (el) el.classList.add('revealed');
    }, 420);
  });
}

// 多张 - 横向滚动
function renderMulti(cards) {
  let html = '<div class="multi-cards">';
  cards.forEach((c, i) => {
    const cc = catClass(c.cat);
    html += `
      <div class="mini-card" style="animation-delay:${i * 0.1}s">
        <span class="mini-cat">${c.cat}</span>
        <div class="mini-quote">${c.quote}</div>
        <span class="mini-num">No.${String(c.id).padStart(2,'0')}</span>
      </div>`;
  });
  html += '</div><button class="close-btn" onclick="closeResult()">收起</button>';
  $cardArea.innerHTML = html;
}

function closeResult() {
  $cardArea.style.display = 'none';
  $cardArea.innerHTML = '';
  updateUI();
}

function resetDeck() {
  deck = shuffle([...CARDS]);
  history = [];
  $cardArea.style.display = 'none';
  $cardArea.innerHTML = '';
  updateHistory();
  updateUI();
  showToast('已重新洗牌 🎴');
}

// ==================== 历史 ====================
function updateHistory() {
  if (history.length === 0) { $historySection.style.display = 'none'; return; }
  $historySection.style.display = '';
  $historyCount.textContent = history.length;
  $historyList.innerHTML = history.map(c => `
    <div class="history-item">
      <span class="history-num">${String(c.id).padStart(2,'0')}</span>
      <div class="history-info">
        <div class="history-cat">${c.cat}</div>
        <div class="history-quote">${c.quote}</div>
      </div>
    </div>`).join('');
}

// ==================== Toast ====================
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', top:'72px', left:'50%', transform:'translateX(-50%)',
    background:'rgba(0,0,0,0.72)', color:'#fff', padding:'9px 22px',
    borderRadius:'20px', fontSize:'13px', zIndex:'9999',
    transition:'opacity 0.3s', opacity:'1', whiteSpace:'nowrap'
  });
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 300); }, 1800);
}

// ==================== Service Worker ====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

updateUI();
</script>
